<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stream-arkisto</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23c2410c'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body>
<header>
  <div class="brand"><span class="logo"></span>Stream-arkisto</div>
  <nav>
    <button data-tab="recordings" class="active">Tallenteet</button>
    <button data-tab="schedules">Aikataulut</button>
    <button data-tab="streams">Striimit</button>
    <button data-tab="status">Tila</button>
  </nav>
  <div id="live" class="live" hidden></div>
</header>

<main>
  <!-- TALLENTEET -->
  <section id="tab-recordings" class="tab">
    <div class="toolbar">
      <input id="f-q" type="search" placeholder="Hae otsikosta, kuvauksesta tai tageista…">
      <select id="f-stream"><option value="">Kaikki striimit</option></select>
      <select id="f-status">
        <option value="">Kaikki tilat</option>
        <option value="ready">Valmis</option>
        <option value="recording">Tallentaa</option>
        <option value="processing">Käsitellään</option>
        <option value="empty">Tyhjä</option>
        <option value="failed">Virhe</option>
      </select>
    </div>
    <div id="rec-summary" class="muted small"></div>
    <div id="rec-list" class="list"></div>
    <button id="rec-more" class="ghost wide" hidden>Näytä lisää</button>
  </section>

  <!-- AIKATAULUT -->
  <section id="tab-schedules" class="tab" hidden>
    <div class="toolbar">
      <h2>Ajastetut tallennukset</h2>
      <button id="sch-add" class="primary">+ Uusi aikataulu</button>
    </div>
    <div id="sch-list" class="list"></div>
  </section>

  <!-- STRIIMIT -->
  <section id="tab-streams" class="tab" hidden>
    <div class="toolbar">
      <h2>Striimit</h2>
      <button id="str-add" class="primary">+ Lisää striimi</button>
    </div>
    <div id="str-list" class="list"></div>
  </section>

  <!-- TILA -->
  <section id="tab-status" class="tab" hidden>
    <div id="status-body"></div>
  </section>
</main>

<!-- Soitin -->
<footer id="player" hidden>
  <div class="p-info">
    <div id="p-title" class="p-title"></div>
    <div id="p-sub" class="muted small"></div>
  </div>
  <div class="p-ctrl">
    <button id="p-back" class="ghost" title="30 s taaksepäin">−30</button>
    <audio id="audio" controls preload="metadata"></audio>
    <button id="p-fwd" class="ghost" title="30 s eteenpäin">+30</button>
    <select id="p-rate" title="Toistonopeus">
      <option value="1">1×</option><option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option><option value="2">2×</option>
    </select>
    <button id="p-close" class="ghost" title="Sulje">✕</button>
  </div>
</footer>

<!-- Dialogit -->
<dialog id="dlg-rec">
  <form method="dialog" id="form-rec">
    <h3>Muokkaa tallennetta</h3>
    <label>Otsikko<input name="title" required maxlength="300"></label>
    <label>Kuvaus<textarea name="description" rows="5"></textarea></label>
    <label>Tagit <span class="muted small">(pilkulla erotettuna)</span><input name="tags"></label>
    <label class="check"><input type="checkbox" name="keep"> Suojattu (ei poisteta automaattisesti)</label>
    <div class="meta muted small" id="rec-meta"></div>
    <menu><button value="cancel" formnovalidate class="ghost">Peruuta</button><button value="ok" class="primary">Tallenna</button></menu>
  </form>
</dialog>

<dialog id="dlg-sch">
  <form method="dialog" id="form-sch">
    <h3 id="sch-h">Aikataulu</h3>
    <label>Striimi<select name="stream_id" required></select></label>
    <label>Ohjelman nimi<input name="title" required maxlength="200" placeholder="esim. Aamun uutiset"></label>
    <fieldset class="days">
      <legend>Päivät</legend>
      <label><input type="checkbox" name="d" value="0">Ma</label>
      <label><input type="checkbox" name="d" value="1">Ti</label>
      <label><input type="checkbox" name="d" value="2">Ke</label>
      <label><input type="checkbox" name="d" value="3">To</label>
      <label><input type="checkbox" name="d" value="4">Pe</label>
      <label><input type="checkbox" name="d" value="5">La</label>
      <label><input type="checkbox" name="d" value="6">Su</label>
    </fieldset>
    <div class="row">
      <label>Alkaa<input name="start_time" type="time" required></label>
      <label>Kesto (min)<input name="duration_min" type="number" min="1" max="1440" required></label>
      <label>Säilytä (pv)<input name="keep_days" type="number" min="1" placeholder="aina"></label>
    </div>
    <label class="check"><input type="checkbox" name="enabled"> Käytössä</label>
    <menu><button value="cancel" formnovalidate class="ghost">Peruuta</button><button value="ok" class="primary">Tallenna</button></menu>
  </form>
</dialog>

<dialog id="dlg-str">
  <form method="dialog" id="form-str">
    <h3 id="str-h">Striimi</h3>
    <label>Nimi<input name="name" required maxlength="200" placeholder="esim. Radio X"></label>
    <label>Osoite <span class="muted small">(Icecast-mount, .pls tai .m3u)</span>
      <div class="inline"><input name="url" type="url" required placeholder="https://palvelin:8000/stream.mp3"><button type="button" id="str-test" class="ghost">Testaa</button></div>
    </label>
    <div id="str-test-result" class="small"></div>
    <fieldset>
      <legend>Hiljaisuuden poisto</legend>
      <div class="row">
        <label>Poista yli (s)<input name="silence_min_s" type="number" min="0" max="600" step="0.5"></label>
        <label>Kynnys (dB)<input name="silence_db" type="number" min="-90" max="-10" step="1"></label>
      </div>
      <p class="muted small">Hiljaisuudet, jotka ovat pidempiä kuin annettu aika, lyhennetään noin sekuntiin. 0 = ei poistoa.</p>
    </fieldset>
    <label class="check"><input type="checkbox" name="enabled"> Käytössä</label>
    <menu><button value="cancel" formnovalidate class="ghost">Peruuta</button><button value="ok" class="primary">Tallenna</button></menu>
  </form>
</dialog>

<dialog id="dlg-now">
  <form method="dialog" id="form-now">
    <h3>Tallenna nyt: <span id="now-name"></span></h3>
    <label>Otsikko <span class="muted small">(vapaaehtoinen)</span><input name="title" maxlength="300"></label>
    <label>Kesto (min)<input name="duration_min" type="number" min="1" max="1440" value="60" required></label>
    <menu><button value="cancel" formnovalidate class="ghost">Peruuta</button><button value="ok" class="primary">● Aloita</button></menu>
  </form>
</dialog>

<div id="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
